# Claude en los PR de PedidosWeb: responde cuando alguien con permiso de escritura escribe @claude.
# Regla del taller (Unidad 6): Claude diagnostica; una persona corrige y hace merge con el CI en verde.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Por defecto, ningún permiso; el job pide solo los que usa.
permissions: {}

# Una sola corrida a la vez por PR o issue; la siguiente espera (no se cancela un diagnóstico a medias).
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Diagnóstico con Claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read          # leer el código; Claude no hace push
      pull-requests: write    # comentar el diagnóstico en el PR
      issues: write           # comentar cuando lo llaman desde un issue
      id-token: write         # la acción lo usa para obtener el token de la Claude GitHub App
      actions: read           # leer los resultados del CI del PR

    steps:
      # Acciones fijadas por commit (SHA), con la versión en el comentario.
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Para que Claude pueda reproducir la falla con dotnet build y dotnet test.
      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.403

      - name: Ejecutar Claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # El token vive solo como secreto del repo; nunca en un archivo.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Le da a Claude las herramientas para ver el estado y descargar el log del CI del PR
          # (requiere actions: read en los permisos del job).
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Bash(dotnet build:*),Bash(dotnet test:*),Bash(git diff:*),Bash(git log:*),mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            --disallowedTools "Edit,Write,NotebookEdit"
            --append-system-prompt "Sigue AGENTS.md. Responde en español de Chile. Solo diagnostica: explica la causa de la falla y propone la corrección, pero no edites archivos ni hagas commits."
