# Configuración de Dependabot para pedidos-web.
# Vigila los paquetes NuGet y las acciones usadas en los workflows de GitHub.
version: 2

updates:
  # Paquetes NuGet: Dependabot recorre la solución y los .csproj desde la raíz.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Junta las versiones menores y de parche en un solo PR.
    groups:
      nuget-menores-y-parches:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Acciones de GitHub: con "/" Dependabot revisa .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Junta las versiones menores y de parche en un solo PR.
    groups:
      acciones-menores-y-parches:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
