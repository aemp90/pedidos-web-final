<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>{{titulo}}</title>
<style>
  /* Diseño único de los PDF de pedidos-web. Para cambiar el estilo, se cambia solo aquí. */
  :root {
    --tinta: #1f2937;
    --tinta-suave: #4b5563;
    --acento: #0f4c81;
    --acento-claro: #e8f0f8;
    --borde: #d1d9e2;
    --fila-par: #f6f8fa;
    --nota-fondo: #fff8e6;
    --nota-borde: #e0a800;
  }

  @page { size: A4; margin: 18mm 18mm 20mm 18mm; }

  * { box-sizing: border-box; }

  html, body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 10.5pt;
    line-height: 1.5;
    color: var(--tinta);
    background: #ffffff;
  }

  h1 {
    margin: 0 0 14pt;
    padding: 14pt 16pt;
    font-size: 19pt;
    line-height: 1.25;
    color: #ffffff;
    background: var(--acento);
    border-radius: 4pt;
  }

  h2 {
    margin: 20pt 0 8pt;
    padding-bottom: 4pt;
    font-size: 13.5pt;
    color: var(--acento);
    border-bottom: 2pt solid var(--acento);
    break-after: avoid;
  }

  h3 { margin: 14pt 0 6pt; font-size: 11.5pt; color: var(--acento); break-after: avoid; }

  p { margin: 0 0 8pt; }
  strong { color: #111827; }
  a { color: var(--acento); }

  ul, ol { margin: 0 0 8pt; padding-left: 18pt; }
  li { margin-bottom: 3pt; }

  code {
    font-family: Consolas, "Courier New", monospace;
    font-size: 9pt;
    padding: 0.5pt 3pt;
    background: var(--acento-claro);
    border-radius: 2pt;
  }

  pre {
    padding: 8pt 10pt;
    background: var(--fila-par);
    border: 1pt solid var(--borde);
    border-radius: 3pt;
    white-space: pre-wrap;
    break-inside: avoid;
  }
  pre code { padding: 0; background: none; }

  blockquote {
    margin: 0 0 10pt;
    padding: 6pt 10pt;
    color: var(--tinta-suave);
    background: var(--nota-fondo);
    border-left: 3pt solid var(--nota-borde);
    border-radius: 0 3pt 3pt 0;
    break-inside: avoid;
  }
  blockquote p:last-child { margin-bottom: 0; }

  table {
    width: 100%;
    margin: 4pt 0 12pt;
    border-collapse: collapse;
    font-size: 9pt;
  }
  thead { display: table-header-group; } /* repite el encabezado si la tabla cruza de página */
  th {
    padding: 5pt 6pt;
    text-align: left;
    color: #ffffff;
    background: var(--acento);
    border: 1pt solid var(--acento);
  }
  td {
    padding: 5pt 6pt;
    vertical-align: top;
    border: 1pt solid var(--borde);
  }
  tbody tr:nth-child(even) td { background: var(--fila-par); }
  tr { break-inside: avoid; }

  hr { margin: 14pt 0; border: none; border-top: 1pt solid var(--borde); }
</style>
</head>
<body>
<main>
{{contenido}}
</main>
</body>
</html>
